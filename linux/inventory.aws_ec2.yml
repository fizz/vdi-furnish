---
plugin: amazon.aws.aws_ec2
regions: [us-east-1]
filters:
  tag:Name: my-workspace # change this
  instance-state-name: running
hostnames:
  - instance-id
compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_shell_type: "'sh'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_aws_ssm_bucket_name: "'my-ssm-transfer-bucket'" # change this; never the state bucket
  ansible_aws_ssm_timeout: 3600
groups:
  workspaces: true
