---
# Finds the desktop by tag and reaches it over SSM. No static inventory, so a replaced
# instance is picked up without an edit.
plugin: amazon.aws.aws_ec2
regions: [us-east-1]
filters:
  tag:Name: my-desktop # change this
  instance-state-name: running
hostnames:
  - instance-id
compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_shell_type: "'powershell'"
  ansible_aws_ssm_region: "'us-east-1'"
  # A bucket the instance role can read, write and delete. Never the state bucket.
  ansible_aws_ssm_bucket_name: "'my-ssm-transfer-bucket'" # change this
  # Without this a long install dies with "Broken pipe".
  ansible_aws_ssm_timeout: 3600
groups:
  desktops: true
